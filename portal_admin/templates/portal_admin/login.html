{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | CareerConnect</title><link rel="stylesheet" href="{% static 'portal_admin/css/style.css' %}"></head><body class="login-page">
<header class="navbar"><a class="brand" href="{% url 'portal_admin:login' %}"><span class="brand-icon">✦</span>Career<span>Connect</span></a><span class="nav-tag">ADMIN PORTAL</span></header>
<section class="auth-section"><div class="auth-card"><div class="auth-icon">✦</div><div class="eyebrow">SECURE ADMIN ACCESS</div><h1>Welcome back</h1><p class="subtitle">Sign in to manage your CareerConnect platform.</p>
{% if error %}<div class="form-errors" role="alert">{{ error }}</div>{% endif %}
<form class="styled-form" method="post">{% csrf_token %}<div class="form-group"><label for="username">Username</label><input id="username" type="text" name="username" placeholder="Enter your username" autocomplete="username" required autofocus></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required></div><button class="btn btn-primary full-width" type="submit">Sign in to Admin →</button></form><p class="auth-switch">Authorized administrators only</p></div></section><footer class="footer">© 2026 CareerConnect · Find your next opportunity.</footer></body></html>
