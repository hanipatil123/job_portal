
{% extends 'portal_admin/base.html' %}

{% block content %}

<div class="page-heading">
    <h1>{{ title }}</h1>
    <p>Enter job details below</p>
</div>

<div class="card">
    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                    <p style="color: red;">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit" class="btn-green">
            Save Job
        </button>

        <a href="{% url 'portal_admin:jobs' %}">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
