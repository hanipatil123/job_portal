<article class="job-card"><div class="job-top"><div class="company-logo">{{ job.company|slice:':1'|upper }}</div><div class="job-heading"><a class="job-title" href="{% url 'job_detail' job.pk %}">{{ job.title }}</a><div class="muted">{{ job.company }}</div></div><span class="tag tag-green">{{ job.job_type }}</span></div><div class="job-meta"><span>⌖ {{ job.location }}</span><span>◷ {{ job.created_at|timesince }} ago</span></div><div class="job-bottom"><span class="salary">{{ job.salary|default:'Competitive salary' }}</span><a class="btn btn-light btn-sm" href="{% url 'job_detail' job.pk %}">View details ↗</a></div></article>
